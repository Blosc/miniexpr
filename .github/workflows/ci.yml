name: CI

on:
  push:
    branches: [ main, numpy-compat, graph-preparation, portable-jit-improvements ]
  workflow_dispatch:
    inputs:
      full_qualification:
        description: Run exhaustive backend qualification and publish exact-revision evidence
        type: boolean
        default: false
  schedule:
    - cron: '23 3 * * 0'
  pull_request:
    branches: [ main ]

concurrency:
  group: native-ci-${{ github.workflow }}-${{ github.ref }}-${{ (github.event_name == 'schedule' || inputs.full_qualification == true) && 'full' || 'gate' }}
  cancel-in-progress: ${{ github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.paths.outputs.relevant }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: paths
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          event = json.load(open(os.environ['GITHUB_EVENT_PATH']))
          relevant = True
          base = event.get('pull_request', {}).get('base', {}).get('sha') or event.get('before')
          if base and os.environ['GITHUB_EVENT_NAME'] in ('push', 'pull_request'):
              result = subprocess.run(['git', 'diff', '--name-only', base, 'HEAD'], capture_output=True, text=True)
              if result.returncode == 0:
                  relevant = any(not (path.endswith('.md') or path.startswith(('doc/', 'docs/', 'plans/')))
                                 for path in result.stdout.splitlines())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'relevant={str(relevant).lower()}\n')
          PY

  build-and-test:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        compiler: [gcc]
        include:
          - os: windows-latest
            compiler: clang-cl
    runs-on: ${{ matrix.os }}
    
    steps:
    - uses: actions/checkout@v7
    
    - name: Set up MSVC (Windows)
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1

    - name: Build library
      shell: bash
      run: |
        if [ "$RUNNER_OS" == "Windows" ]; then
          # No -G: CMake defaults to the newest Visual Studio installed, so the
          # runner image can move to a new VS without breaking the build.
          # Visual Studio generators are multi-config; select Release at build time.
          cmake -S . -B build -T ClangCL \
            -DCMAKE_C_COMPILER=clang-cl -DMINIEXPR_BUILD_ARTIFACT=ON
          grep -Ei '^CMAKE_C_COMPILER:(FILEPATH|STRING|UNINITIALIZED)=.*clang-cl' build/CMakeCache.txt
        else
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DMINIEXPR_BUILD_ARTIFACT=ON
        fi
        if [ "$RUNNER_OS" == "Windows" ]; then
          cmake --build build --config Release
        else
          cmake --build build --parallel
        fi
    
    - name: Build and run tests
      shell: bash
      run: |
        if [ "$RUNNER_OS" == "Windows" ]; then
          ctest --test-dir build -C Release -LE 'jit-(full|gate)' --timeout 120 --output-on-failure
        else
          ctest --test-dir build -LE 'jit-(full|gate)' --output-on-failure
        fi

    - name: Qualify both supported system compilers
      if: runner.os != 'Windows'
      shell: bash
      env:
        FULL_QUALIFICATION: ${{ github.event_name == 'schedule' || inputs.full_qualification == true }}
      run: |
        mode=--compact
        if [ "$FULL_QUALIFICATION" = true ]; then mode=; fi
        gcc=$(command -v gcc)
        if [ "$RUNNER_OS" = macOS ]; then
          gcc=
          for version in 16 15 14 13; do
            if command -v "gcc-$version" >/dev/null; then gcc=$(command -v "gcc-$version"); break; fi
          done
          test -n "$gcc"
        fi
        clang=$(command -v clang)
        for compiler in "$gcc" "$clang"; do
          backend=$(basename "$compiler")
          ME_DSL_JIT_COMPILER=cc CC="$compiler" ME_DSL_JIT_CACHE_DIR="$PWD/build/jit-cache-$backend" \
            build/tests/portable_jit_parity --require-jit $mode
        done

    - name: Trace DSL JIT backend activity
      if: ${{ false }}
      shell: bash
      run: |
        set -o pipefail
        if [ "$RUNNER_OS" == "Windows" ]; then
          ME_DSL_TRACE=1 ctest --test-dir build -C Release -R "^test_dsl_jit_runtime_cache$" -V \
            2>&1 | tee build/dsl-jit-trace.log
        else
          ME_DSL_TRACE=1 ctest --test-dir build -R "^test_dsl_jit_runtime_cache$" -V \
            2>&1 | tee build/dsl-jit-trace.log
        fi
        grep -E "jit ir built:|jit runtime (built|skip|hit|stubbed):" build/dsl-jit-trace.log || true

    - name: Install native graph distribution
      shell: bash
      run: |
        cmake --install build --config Release --prefix "$PWD/graph-dist"
        test -f graph-dist/include/miniexpr_graph.h
        test -f graph-dist/share/miniexpr/graphs/native-staged-graph-1.schema.json
        git rev-parse HEAD > graph-dist/native-revision.txt

    - uses: actions/upload-artifact@v4
      with:
        name: native-graph-${{ matrix.os }}
        path: graph-dist

  linux-arm64-jit:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-24.04-arm

    steps:
    - uses: actions/checkout@v7

    - name: Configure (JIT enabled)
      shell: bash
      run: |
        cmake -S . -B build-arm64-jit -DCMAKE_BUILD_TYPE=Release -DMINIEXPR_ENABLE_TCC_JIT=ON -DMINIEXPR_BUILD_ARTIFACT=ON
        grep -E '^MINIEXPR_ENABLE_TCC_JIT:BOOL=ON$' build-arm64-jit/CMakeCache.txt

    - name: Build
      shell: bash
      run: |
        cmake --build build-arm64-jit --parallel

    - name: Test
      shell: bash
      run: |
        ME_DSL_JIT=1 ctest --test-dir build-arm64-jit -LE jit-full --output-on-failure

  linux-arm64-interpreter:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-24.04-arm

    steps:
    - uses: actions/checkout@v7

    - name: Configure (interpreter only)
      shell: bash
      run: |
        cmake -S . -B build-arm64-interpreter -DCMAKE_BUILD_TYPE=Release -DMINIEXPR_ENABLE_TCC_JIT=OFF -DMINIEXPR_BUILD_ARTIFACT=ON
        grep -E '^MINIEXPR_ENABLE_TCC_JIT:BOOL=OFF$' build-arm64-interpreter/CMakeCache.txt

    - name: Build
      shell: bash
      run: |
        cmake --build build-arm64-interpreter --parallel

    - name: Test
      shell: bash
      run: |
        # Individual interpreter tests already select ME_JIT_OFF/ME_DSL_JIT=0.
        # Do not globally disable the required-CC cases: CC remains independently
        # available even when the TCC backend is disabled in this build.
        ctest --test-dir build-arm64-interpreter -LE jit-full -E "^test_dsl_jit_runtime_cache$" --output-on-failure

  windows-arm64:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: windows-11-arm

    steps:
    - uses: actions/checkout@v7

    - name: Set up MSVC (Windows/ARM64)
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: arm64

    - name: Configure
      shell: bash
      run: |
        # Keep Windows/ARM64 on interpreter mode until minicc/libtcc supports this target.
        # Let CMake select the newest installed Visual Studio, as in the Windows job above.
        cmake -S . -B build-win-arm64 -A ARM64 -T ClangCL \
          -DCMAKE_C_COMPILER=clang-cl \
          -DMINIEXPR_BUILD_BUNDLED_LIBTCC=OFF \
          -DMINIEXPR_ENABLE_TCC_JIT=OFF -DMINIEXPR_BUILD_ARTIFACT=ON
        grep -Ei '^CMAKE_C_COMPILER:(FILEPATH|STRING|UNINITIALIZED)=.*clang-cl' build-win-arm64/CMakeCache.txt
        grep -E '^MINIEXPR_BUILD_BUNDLED_LIBTCC:BOOL=OFF$' build-win-arm64/CMakeCache.txt
        grep -E '^MINIEXPR_ENABLE_TCC_JIT:BOOL=OFF$' build-win-arm64/CMakeCache.txt

    - name: Build
      shell: bash
      run: |
        cmake --build build-win-arm64 --config Release

    - name: Test
      shell: bash
      run: |
        ME_DSL_JIT=0 ctest --test-dir build-win-arm64 -C Release --timeout 120 -E "^test_dsl_jit_runtime_cache$" --output-on-failure || \
          ME_DSL_JIT=0 ctest --test-dir build-win-arm64 -C Release --timeout 120 -E "^test_dsl_jit_runtime_cache$" --rerun-failed --output-on-failure

  miniexpr-wasm32:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'

    - name: Set up Emscripten
      uses: mymindstorm/setup-emsdk@v14
      with:
        version: latest

    - name: Configure wasm32 build
      shell: bash
      run: |
        emcmake cmake -S . -B build-wasm32 -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_CROSSCOMPILING_EMULATOR=node \
          -DMINIEXPR_BUILD_SHARED=OFF \
          -DMINIEXPR_BUILD_STATIC=ON \
          -DMINIEXPR_BUILD_ARTIFACT=ON \
          -DMINIEXPR_BUILD_BENCH=OFF \
          -DMINIEXPR_BUILD_EXAMPLES=OFF \
          -DMINIEXPR_USE_SLEEF=OFF \
          -DMINIEXPR_BUILD_BUNDLED_LIBTCC=OFF \
          -DMINIEXPR_DSL_TRACE_DEFAULT=ON

    - name: Verify wasm32 CMake flags
      shell: bash
      run: |
        grep -E '^MINIEXPR_BUILD_BUNDLED_LIBTCC:BOOL=OFF$' build-wasm32/CMakeCache.txt
        grep -E '^MINIEXPR_ENABLE_TCC_JIT:BOOL=ON$' build-wasm32/CMakeCache.txt
        grep -E '^MINIEXPR_WASM32_SIDE_MODULE:BOOL=ON$' build-wasm32/CMakeCache.txt

    - name: Build wasm32 miniexpr + tests
      shell: bash
      run: |
        cmake --build build-wasm32 -j

    - name: Run wasm32 tests
      shell: bash
      run: |
        ctest --test-dir build-wasm32 --output-on-failure || \
          ctest --test-dir build-wasm32 --rerun-failed --output-on-failure

    - name: Verify wasm32 side-module JIT helper path
      shell: bash
      run: |
        set -o pipefail
        ME_DSL_TRACE=1 ctest --test-dir build-wasm32 -R "^test_dsl_jit_side_module$" -V \
          | tee build-wasm32/side-module-trace.log
        grep -Eq "\\[me-dsl\\] jit runtime built: fp=.* compiler=tcc" \
          build-wasm32/side-module-trace.log

    - name: Trace DSL JIT behavior (wasm32)
      shell: bash
      run: |
        set -o pipefail
        : > build-wasm32/dsl-trace.log
        node -e 'global.Module={ENV:{ME_DSL_TRACE:"1"}}; require("./build-wasm32/tests/test_dsl_jit_ir.js");' \
          >> build-wasm32/dsl-trace.log 2>&1
        node -e 'global.Module={ENV:{ME_DSL_TRACE:"1"}}; require("./build-wasm32/tests/test_dsl_syntax.js");' \
          >> build-wasm32/dsl-trace.log 2>&1
        echo "=== DSL JIT Trace Summary (wasm32) ==="
        if grep -E "\\[me-dsl\\] (jit ir (built|skip|reject):|jit runtime (built|skip|hit|stubbed):)" \
             build-wasm32/dsl-trace.log > /tmp/dsl-trace-summary.raw; then
          sed -E 's/fingerprint=[0-9a-f]+/fingerprint=<fp>/g; s/key=[0-9a-f]+/key=<key>/g' \
            /tmp/dsl-trace-summary.raw \
            | sort \
            | uniq -c \
            | sed -E 's/^ +//'
        else
          echo "No DSL JIT trace lines captured"
        fi
        echo "=== End Summary ==="

  sanitizer-qualification:
    if: github.event_name == 'schedule' || inputs.full_qualification == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build checked native helpers with sanitizers
        run: |
          CC=clang cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug \
            -DMINIEXPR_BUILD_ARTIFACT=ON -DMINIEXPR_BUILD_BUNDLED_LIBTCC=OFF \
            -DMINIEXPR_ENABLE_TCC_JIT=OFF -DMINIEXPR_BUILD_EXAMPLES=OFF -DMINIEXPR_BUILD_BENCH=OFF \
            '-DCMAKE_C_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer' \
            '-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined' \
            '-DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=address,undefined'
          # Only this executable is exercised below; do not build unrelated
          # legacy tests under the sanitizer job's Clang configuration.
          cmake --build build-asan --target portable_jit_parity --parallel 4
      - name: Qualify sanitized bridges and interpretation
        run: ctest --test-dir build-asan -R portable_jit_parity --output-on-failure

  qualification-evidence:
    name: Publish full native qualification
    if: github.event_name == 'schedule' || inputs.full_qualification == true
    needs: [build-and-test, linux-arm64-jit, linux-arm64-interpreter, windows-arm64, miniexpr-wasm32, sanitizer-qualification]
    runs-on: ubuntu-latest
    steps:
      - name: Record qualified revision
        run: |
          printf '{"native_sha":"%s","run_id":"%s","tier":"full"}\n' \
            '${{ github.sha }}' '${{ github.run_id }}' > native-qualification.json
      - uses: actions/upload-artifact@v4
        with:
          name: native-qualification-${{ github.sha }}
          path: native-qualification.json
